name: Package qualification

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
          components: rustfmt,clippy
      - run: uv sync --locked
      - run: uv run python scripts/check_license.py
      - run: uv run python scripts/check_public_tree.py
      - run: uv run python scripts/test_publication.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p icad-core --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run maturin sdist --out dist
      - name: Rebuild sdist in a separate source and Cargo target
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/icadkit-source"
          tar -xzf dist/icadkit-*.tar.gz -C "$RUNNER_TEMP/icadkit-source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/icadkit-target"
          cd "$RUNNER_TEMP/icadkit-source"/icadkit-*
          uv build --wheel --out-dir "$GITHUB_WORKSPACE/rebuilt"
      - name: Check rebuilt payload and cold install
        shell: bash
        run: |
          cp dist/*.tar.gz rebuilt/
          uv run python scripts/verify_artifacts.py rebuilt --output reports/artifacts-rebuilt.json
          icad_sdist_sources=("$RUNNER_TEMP/icadkit-source"/icadkit-*)
          test "${#icad_sdist_sources[@]}" -eq 1
          uv run python scripts/verify_install.py --wheel rebuilt/*.whl \
            --source "${icad_sdist_sources[0]}" \
            --python 3.10 --python 3.14 --output reports/cold-sdist.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-source
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-quality
          path: reports/*.json
          if-no-files-found: error

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.15.0"
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
      - name: Cold install exact candidate wheel
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            extra_pythons="--python 3.11 --python 3.12 --python 3.13"
          else
            extra_pythons=""
          fi
          uv run --no-project --python 3.12 python scripts/verify_install.py \
            --wheel dist/*.whl --source "$GITHUB_WORKSPACE" \
            --python 3.10 --python 3.14 $extra_pythons \
            --output "reports/cold-${RUNNER_OS}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Cold install preview extra from exact candidate wheel
        shell: bash
        run: |
          uv run --no-project --python 3.12 python scripts/verify_install.py \
            --wheel dist/*.whl --source "$GITHUB_WORKSPACE" \
            --preview --python 3.12 --output "reports/preview-${RUNNER_OS}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}
          path: reports/*.json
          if-no-files-found: error

  artifact-set:
    needs: [quality, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/verify_artifacts.py dist --require-platform-set --output reports/artifacts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-candidate
          path: |
            dist/*
            reports/artifacts.json
          if-no-files-found: error
